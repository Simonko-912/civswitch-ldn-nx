name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4

      - name: Build NRO
        run: make
        env:
          DEVKITPRO: /opt/devkitpro

      - name: Verify NRO
        run: |
          test -f civswitch-ldn-nx.nro
          ls -la civswitch-ldn-nx.nro

      - uses: actions/upload-artifact@v4
        with:
          name: nro
          path: civswitch-ldn-nx.nro

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nro

      - name: Create release and upload NRO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la civswitch-ldn-nx.nro
          cat > notes.md <<'EOF'
          ## Launch-mode guard

          v1.1.0 detects how the app was launched and blocks unsupported
          application-mode starts.

          - From the Album (applet mode), and as a Civilization VII title
            override, the app works exactly as before.
          - In application mode (hold-R title override), the app reads the host
            title through pm:dmnt and continues only for Civilization VII.
          - Any other overridden title, or a title that cannot be identified,
            shows a blocking screen asking the user to launch from the Album
            instead; LDN is never initialised in that case.
          - The ldn_mitm hard-block from earlier releases remains in place.

          The NRO is built in CI from the tagged source with devkitPro.
          EOF
          gh release create "$TAG" civswitch-ldn-nx.nro \
            --title "CivSwitch-LDN-NX $TAG" \
            --notes-file notes.md

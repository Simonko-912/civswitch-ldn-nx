name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4

      - name: Build NRO
        run: make
        env:
          DEVKITPRO: /opt/devkitpro

      - name: Verify NRO
        run: |
          test -f civswitch-ldn-nx.nro
          ls -la civswitch-ldn-nx.nro

      - uses: actions/upload-artifact@v4
        with:
          name: nro
          path: civswitch-ldn-nx.nro

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nro

      - name: Create release and upload NRO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la civswitch-ldn-nx.nro
          cat > notes.md <<'EOF'
          ## Faster trigger-save startup

          v1.2.0 shortens the launch of the persistent trigger save. The encoded
          loader stage is now kept in a hidden HTML span: the bootstrap still
          reads it from the document text, while the game no longer lays out the
          full hexadecimal payload.

          - Applies to trigger saves written from now on. After upgrading, run
            the ZR one-click installation once to replace the older trigger save
            (it clears every single-player save, so back up first).
          - Normal save loading, the LDN connection flow and the launch-mode
            guard are unchanged.
          - The ldn_mitm hard-block and the applet-mode preference from earlier
            releases remain in place.

          The NRO is built in CI from the tagged source with devkitPro.
          EOF
          gh release create "$TAG" civswitch-ldn-nx.nro \
            --title "CivSwitch-LDN-NX $TAG" \
            --notes-file notes.md

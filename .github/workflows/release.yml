name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4

      - name: Build NRO
        run: make
        env:
          DEVKITPRO: /opt/devkitpro

      - name: Verify NRO
        run: |
          test -f civswitch-ldn-nx.nro
          ls -la civswitch-ldn-nx.nro

      - uses: actions/upload-artifact@v4
        with:
          name: nro
          path: civswitch-ldn-nx.nro

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nro

      - name: Create release and upload NRO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la civswitch-ldn-nx.nro
          cat > notes.md <<'EOF'
          ## ldn_mitm environment guard

          v1.0 detects and handles conflicts with ldn_mitm and any other
          sysmodule that MITMs the LDN service.

          - On startup the app checks whether ldn:u has a MITM. If it does, it
            shows a blocking screen and never initialises LDN or scans; the
            module must be removed and the console rebooted (turning it off in
            its config is not enough).
          - Scans now discard empty placeholder entries from ordinary WiFi
            signals, so the network count reflects real rooms only.
          - The empty-scan screen shows troubleshooting guidance after a manual
            scan.
          - Launch in applet mode from the Album; an R-button title override
            can scan but cannot complete the game-level join.

          The NRO is built in CI from the tagged source with devkitPro.
          EOF
          gh release create "$TAG" civswitch-ldn-nx.nro \
            --title "CivSwitch-LDN-NX $TAG" \
            --notes-file notes.md
